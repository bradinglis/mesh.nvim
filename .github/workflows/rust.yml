name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }} 
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   artifact_name: target/x86_64-apple-darwin/release/libdifftastic_nvim.dylib
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact_name: target/aarch64-apple-darwin/release/libdifftastic_nvim.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: target/x86_64-unknown-linux-gnu/release/libdifftastic_nvim.so
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false    
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: taiki-e/install-action@v2
      if: contains(matrix.os, 'ubuntu')
      with:
        tool: cross
    - name: Build for Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        cross build --release --target ${{ matrix.target }}
        mv "${{ matrix.artifact_name }}" "${{ matrix.target }}.so"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ matrix.target }}.*

