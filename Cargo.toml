[package]
name = "markdown_db"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4.44"
duckdb = { version = "1.10500.0", features = ["bundled"] }
lopdf = "0.40.0"
mlua = {version = "0.11", features = ["module", "luajit"]}
pdf_oxide = "0.3.57"
rapidhash = "4.4.1"
regex = "1.12.3"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
unicode-bom = "2.0.3"

[profile.release]
codegen-units = 1
lto = "fat"


